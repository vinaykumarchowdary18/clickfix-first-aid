<!doctype html><meta charset="utf-8"><title>Trap: ClipboardItem</title>
<script src="_trap.js"></script>
<h1>Verification</h1>
<button id="robot">I am human</button>
<script>
document.getElementById('robot').addEventListener('click', async () => {
  const item = new ClipboardItem({ 'text/plain': new Blob([TRAP_COMMAND], { type: 'text/plain' }) });
  try { await navigator.clipboard.write([item]); document.title = 'copied'; } catch (e) { document.title = 'error ' + e; }
});
</script>
