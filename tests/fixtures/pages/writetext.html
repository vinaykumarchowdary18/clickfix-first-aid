<!doctype html><meta charset="utf-8"><title>Trap: writeText</title>
<script src="_trap.js"></script>
<h1>Checking if the site connection is secure</h1>
<label><input type="checkbox" id="robot"> I'm not a robot</label>
<p id="steps" hidden></p>
<script>
document.getElementById('robot').addEventListener('click', async () => {
  document.getElementById('steps').textContent = TRAP_INSTRUCTIONS;
  document.getElementById('steps').hidden = false;
  try { await navigator.clipboard.writeText(TRAP_COMMAND); document.title = 'copied'; } catch (e) { document.title = 'error ' + e; }
});
</script>
