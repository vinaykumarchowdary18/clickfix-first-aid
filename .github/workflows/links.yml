name: Recovery guide links

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    # Pinned like the CI job: ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run links
