name: Release

# Publishes a release built from the source in this repository, on GitHub's own
# machine, with checksums. Nobody's PC is involved, so what people download
# matches the code. Start it either way:
#   - Actions tab > Release > Run workflow (uses the version in package.json), or
#   - push a tag like v0.3.1.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Work out the version
        id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($tag)"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Raise the version in package.json first."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generated files are up to date
        run: npm run check-build
      - name: Engine tests
        run: npm test
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: xvfb-run -a npm run test:e2e
      - name: Build release files
        run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          notes=$(awk -v v="## $TAG " 'index($0, v) == 1 {on=1; next} /^## v/ && on {exit} on' CHANGELOG.md)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ClickFix First Aid $TAG" --notes "${notes:-See CHANGELOG.md}"
          echo "::notice::Published $TAG"
