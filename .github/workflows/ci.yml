name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned: Playwright 1.56 supports Ubuntu 24.04, and ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies (exact versions from the lockfile)
        run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Generated files are up to date
        run: npm run check-build
      - name: Engine and contract tests
        run: npm test
      - name: PowerShell checker tests
        shell: pwsh
        run: ./checker/tests/Run-Tests.ps1
      - name: Install Chromium for the browser tests
        run: |
          echo "::notice::$(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          npx playwright install --with-deps chromium
      - name: Browser tests (the real extension in Chromium)
        run: xvfb-run -a npm run test:e2e
      - name: Build release files
        run: npm run package
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: release-files
          path: dist/

  windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Checker tests on Windows PowerShell 5.1
        shell: powershell
        run: .\checker\tests\Run-Tests.ps1
      - name: Real read-only PC check runs without errors
        shell: powershell
        run: |
          .\checker\Check-ClickFix.ps1 -Json -NoPause | Out-File result.json
          Get-Content result.json
          if ($LASTEXITCODE -gt 2) { exit 1 } else { exit 0 }

  # Antivirus programs scan files for attack text, and a security project is
  # full of it. This scans the repository the way a Windows user's PC would
  # when they download it, so a false alarm is caught here first.
  defender-scan:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Scan the repository with Microsoft Defender
        shell: powershell
        run: |
          try { Get-MpComputerStatus -ErrorAction Stop | Out-Null } catch { Write-Host "::warning::Microsoft Defender is not available on this runner, so the scan was skipped: $($_.Exception.Message)"; exit 0 }
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Warning "Could not update Defender signatures: $($_.Exception.Message)" }
          $status = Get-MpComputerStatus
          Write-Host ("Defender engine {0}, signatures {1} ({2})" -f $status.AMEngineVersion, $status.AntivirusSignatureVersion, $status.AntivirusSignatureLastUpdated)
          # Defender sometimes needs a moment after a signature update; try up to three times.
          for ($try = 1; $try -le 3; $try++) {
            $out = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE" -DisableRemediation 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if (-not ($out | Where-Object { "$_" -match 'CmdTool: Failed with hr' })) { break }
            if ($try -lt 3) { Write-Host "Defender could not start the scan; waiting 30 seconds before trying again."; Start-Sleep -Seconds 30 }
          }
          # If Defender itself failed to run (for example "CmdTool: Failed with hr = 0x800106ba"),
          # nothing was scanned: say so, but do not report it as a detection.
          $toolError = $out | Where-Object { "$_" -match 'CmdTool: Failed with hr' } | Select-Object -First 1
          if ($toolError) { Write-Host ("::warning::Microsoft Defender could not run on this runner, so the repository was not scanned: {0}" -f "$toolError".Trim()); exit 0 }
          if ($code -eq 2) {
            # MpCmdRun prints "Threat : <name>" followed by the file it was found in.
            # Name each one on the run page, so nobody needs the raw log.
            $threat = ''
            $shown = 0
            foreach ($line in $out) {
              $t = [string]$line
              if ($t -match 'Threat\s*:\s*(.+)$') { $threat = $Matches[1].Trim() }
              elseif ($t -match '(?:file|containerfile)\s*:\s*(.+)$') {
                $file = $Matches[1].Trim().Replace($env:GITHUB_WORKSPACE + '\', '')
                Write-Host ("::error title=Defender: {0}::{1}" -f $threat, $file)
                $shown++
              }
            }
            if ($shown -eq 0) { $out | Where-Object { "$_".Trim() } | Select-Object -First 30 | ForEach-Object { Write-Host ("::warning title=Defender output::{0}" -f "$_".Trim()) } }
            Write-Host '::error::Microsoft Defender flagged a file in the repository.'
            exit 1
          }
          if ($code -ne 0) { Write-Host "::warning::Microsoft Defender scan did not finish (MpCmdRun exit code $code)."; exit 0 }
          Write-Host ("::notice::Microsoft Defender scanned the repository and found nothing (signatures {0})." -f $status.AntivirusSignatureVersion)
