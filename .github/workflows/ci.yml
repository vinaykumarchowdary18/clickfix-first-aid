name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies (exact versions from the lockfile)
        run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Generated files are up to date
        run: npm run check-build
      - name: Engine and contract tests
        run: npm test
      - name: PowerShell checker tests
        shell: pwsh
        run: ./checker/tests/Run-Tests.ps1
      - name: Browser tests (the real extension in Chromium)
        run: |
          npx playwright install --with-deps chromium
          xvfb-run -a npm run test:e2e
      - name: Build release files
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: release-files
          path: dist/

  windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checker tests on Windows PowerShell 5.1
        shell: powershell
        run: .\checker\tests\Run-Tests.ps1
      - name: Real read-only PC check runs without errors
        shell: powershell
        run: |
          .\checker\Check-ClickFix.ps1 -Json -NoPause | Out-File result.json
          Get-Content result.json
          if ($LASTEXITCODE -gt 2) { exit 1 } else { exit 0 }
